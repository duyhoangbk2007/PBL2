/* v8: standalone pricing screen */
.price-intro{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.price-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:var(--shadow);min-width:0}
.price-card .label{font-size:12px;color:#6f7f96;font-weight:700;margin-bottom:8px}.price-card strong{font-size:23px;letter-spacing:-.5px}
.price-card .icon{display:block;font-size:25px;margin-bottom:12px}
.price-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.price-section-title{font-size:15px;margin:0 0 14px}
.price-action-bar{display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap;margin-top:19px}
.price-note{background:#f9fbff;border:1px dashed #d1daf0;border-radius:10px;padding:13px 16px;color:#687993;font-size:12px;line-height:1.7;margin-top:17px}
.price-form-grid input:disabled{background:#f5f6f9;color:#53617b;opacity:1}
@media(max-width:780px){.price-grid{grid-template-columns:1fr}.price-form-grid{grid-template-columns:1fr}}

function availableShows(){return d.showtimes.filter(x=>x.status==='SCHEDULED'&&new Date(x.start)>new Date())}
function soldSeats(showtimeId){return d.tickets.filter(t=>t.showtime===showtimeId&&t.status==='SOLD').map(t=>t.seat)}
function saleLines(){const st=sBy(S.sale.showtime),member=memberBy(S.sale.member);return S.sale.selected.map(id=>{const seat=d.seats.find(x=>x.id===id&&x.room===st?.room);if(!seat)return null;const base=price(seat.type),type=S.sale.types[id]||'REGULAR';const discountPct=Math.max(type==='STUDENT'?d.pricing.studentDiscount:0,member?d.pricing.memberDiscount:0);const paid=base*(100-discountPct)/100;return{id,seat,type,base,discount:base-paid,paid,points:member?Math.floor(paid/10000):0}}).filter(Boolean)}
function saleTotal(){return saleLines().reduce((a,x)=>a+x.paid,0)}
function salesHTML(){
const available=availableShows();
const movieIds=new Set(available.map(x=>x.movie));
const movies=d.movies.filter(x=>x.active&&movieIds.has(x.id));
if(!movies.length)return `<section class="panel"><div class="empty">Hiện không có phim có suất chiếu hợp lệ để bán vé.</div></section>`;
if(S.sale.movie&&!movies.some(x=>x.id===S.sale.movie)){S.sale.movie='';S.sale.showtime='';S.sale.selected=[];S.sale.types={}}
const shows=available.filter(x=>x.movie===S.sale.movie);
if(S.sale.showtime&&!shows.some(x=>x.id===S.sale.showtime)){S.sale.showtime='';S.sale.selected=[];S.sale.types={}}

const picker=`<div class="field"><label for="sale-movie">1. Chọn phim</label><select id="sale-movie" class="inline-input">${movieOptions}</select></div><div class="field" style="margin-top:16px"><label for="sale-show">2. Chọn suất chiếu</label><select id="sale-show" class="inline-input" ${S.sale.movie?'':'disabled'}>${showOptions}</select></div>`;
const steps=`<div class="stepper"><span class="${!current?'active':''}">1 · Chọn phim & suất chiếu</span><span class="${current?'active':''}">2 · Chọn ghế</span><span>3 · Vé, thành viên & thanh toán</span></div>`;
if(!current)return `${steps}<section class="panel"><div class="panel-head"><h2>01. Chọn phim và suất chiếu</h2><span class="tag blue">SCHEDULED · chưa bắt đầu</span></div><div class="panel-body">${picker}<p class="helper">Chỉ hiển thị suất chiếu chưa bắt đầu của phim đã chọn.</p></div></section><section class="panel" style="margin-top:14px"><div class="panel-body"><div class="empty">Chọn phim và suất chiếu để hiển thị sơ đồ ghế và tiếp tục bán vé.</div></div></section>`;
const rm=rBy(current.room),sold=soldSeats(current.id),lines=saleLines();
let seatHTML='';for(let row=1;row<=rm.rows;row++)for(let col=1;col<=rm.cols;col++){const seat=d.seats.find(x=>x.room===rm.id&&x.row===row&&x.col===col);const isSold=seat&&sold.includes(seat.id),isSel=seat&&S.sale.selected.includes(seat.id);seatHTML+=seat?`<button data-ticket-seat="${seat.id}" class="ticket-seat ${seat.type.toLowerCase()} ${isSold?'sold':''} ${isSel?'selected':''}" ${isSold?'disabled':''} title="${seat.id} · ${seat.type}">${seat.id}</button>`:'<button class="ticket-seat placeholder" disabled>·</button>'}
return `${steps}<div class="two-col"><div class="item-stack"><section class="panel"><div class="panel-head"><h2>01. Chọn phim và suất chiếu</h2><span class="tag blue">SCHEDULED · chưa bắt đầu</span></div><div class="panel-body">${picker}<p class="helper">${current.id} · ${current.room} · ${mBy(current.movie)?.age}+ · chỉ bán vé tại quầy</p></div></section><section class="panel"><div class="panel-head"><h2>02. Chọn ghế</h2><span class="count">${S.sale.selected.length} đã chọn</span></div><div class="panel-body"><div class="screen">MÀN HÌNH CHIẾU</div><div class="ticket-seats">${seatHTML}</div><div class="legend"><span>⬜ Standard</span><span>🟪 VIP</span><span>🩷 Couple</span><span>⬛ Đã bán</span><span>🔵 Đã chọn</span></div><div class="flex-gap"><button id="undo-seat" class="btn" ${S.sale.selected.length?'':'disabled'}>↶ Hoàn tác chọn gần nhất</button><button id="clear-seats" class="btn" ${S.sale.selected.length?'':'disabled'}>Bỏ lựa chọn</button></div><p class="helper">Ghế đôi được bán nguyên cặp bằng một vé; hai người xem. Tình trạng đã bán được xác định riêng theo suất chiếu, không lưu trên sơ đồ phòng.</p></div></section><section class="panel"><div class="panel-head"><h2>03. Loại vé & thành viên</h2><span class="tag">Giá theo cấu hình · demo</span></div><div class="panel-body"><div class="item-stack">${lines.length?lines.map(x=>`<div class="purchase-line"><div><b>${x.id}</b> <span class="small-muted">${x.seat.type}${x.seat.type==='COUPLE'?' · 2 người':''}</span></div><select class="inline-input" data-ticket-type="${x.id}"><option value="REGULAR" ${x.type==='REGULAR'?'selected':''}>Thường</option><option value="STUDENT" ${x.type==='STUDENT'?'selected':''}>Học sinh</option></select><b>${vnd(x.paid)}</b></div>`).join(''):'<p class="small-muted">Hãy chọn ghế trước khi đặt loại vé.</p>'}<div class="field member-lookup"><label for="sale-member-search">Tìm thành viên (không bắt buộc)</label><input id="sale-member-search" class="inline-input" value="${esc(S.memberQuery)}" placeholder="Nhập tên, số điện thoại hoặc mã thành viên..." autocomplete="off" aria-controls="sale-member-results" aria-label="Tra cứu thành viên"/><div id="sale-member-results" class="member-results" aria-live="polite"></div>${S.sale.member?`<div class="member-picked"><div><b>${esc(memberBy(S.sale.member)?.name||S.sale.member)}</b><small>${esc(memberBy(S.sale.member)?.phone||'')} · ${S.sale.member} · tích điểm</small></div><button id="clear-sale-member" class="btn small" type="button">Bỏ chọn</button></div>`:'<p class="helper">Chưa chọn thành viên → bán cho khách lẻ, không tích điểm.</p>'}<p class="helper">Tìm theo tên, mã hoặc số điện thoại; chỉ hiển thị tối đa 8 kết quả mỗi lần để dễ dùng khi có nhiều thành viên.</p></div><div class="small-muted">Ưu đãi hiện tại: học sinh ${d.pricing.studentDiscount}%, thành viên ${d.pricing.memberDiscount}%; áp dụng mức cao nhất, không cộng dồn. Điểm = phần nguyên của tiền thực trả/10.000 trên từng vé.</div></div></div></section></div><aside class="panel ticket-summary"><div class="panel-head"><h2>Đơn bán vé</h2><span class="tag orange">DEMO · Service chờ tích hợp</span></div><div class="panel-body"><p class="small-muted">${esc(mBy(current.movie)?.title)}<br>${dt(current.start)} · ${esc(rm.name)}</p><div class="divider"></div>${lines.length?lines.map(x=>`<div class="note-row"><div class="flex-gap" style="justify-content:space-between"><b>${x.id} · ${x.type==='STUDENT'?'Học sinh':'Thường'}</b><span>${vnd(x.paid)}</span></div><span class="small-muted">Giá gốc ${vnd(x.base)} · Giảm ${vnd(x.discount)}</span></div>`).join(''):'<p class="small-muted">Chưa chọn ghế.</p>'}<div class="divider"></div><div class="flex-gap" style="justify-content:space-between"><b>Tạm tính</b><strong class="amount">${vnd(saleTotal())}</strong></div><p class="helper">${S.sale.member?`Tích khoảng ${lines.reduce((s,x)=>s+x.points,0)} điểm cho thành viên.`:'Chưa gắn thành viên.'}</p><div class="divider"></div><label class="note-row check-line"><input type="checkbox" id="student-confirm" ${S.sale.studentConfirm?'checked':''}><span>Đã kiểm tra điều kiện vé học sinh (nếu có)</span></label><label class="note-row check-line"><input type="checkbox" id="age-confirm" ${S.sale.ageConfirm?'checked':''}><span>Đã xác nhận độ tuổi khách xem phim</span></label><label class="note-row check-line"><input type="checkbox" id="cash-confirm" ${S.sale.cashConfirm?'checked':''}><span>Đã thu đủ tiền tại quầy (demo)</span></label><p class="pending">Khi có backend: kiểm tra lại ghế, tạo vé/hóa đơn, cập nhật điểm và lưu dữ liệu. Bản HTML chỉ mô phỏng kết quả, không phải giao dịch thật.</p><button id="sale-confirm" class="btn primary" style="width:100%" ${!lines.length?'disabled':''}>Xác nhận bán vé (demo)</button></div></aside></div>`}
function invLines(inv){return d.tickets.filter(t=>t.invoice===inv.id)}function invStatus(inv){const t=invLines(inv);return t.every(x=>x.status==='CANCELLED')?'Đã hủy':t.some(x=>x.status==='CANCELLED')?'Hủy một phần':'Đang hiệu lực'}

function reportsHTML(){const from=S.reportFilter.from,to=S.reportFilter.to;const inv=d.invoices.filter(x=>(!from||x.created.slice(0,10)>=from)&&(!to||x.created.slice(0,10)<=to));const invIDs=new Set(inv.map(x=>x.id));const soldAmount=inv.reduce((sum,x)=>sum+x.total,0);const canc=d.tickets.filter(x=>x.status==='CANCELLED'&&(!from||x.cancelledAt.slice(0,10)>=from)&&(!to||x.cancelledAt.slice(0,10)<=to));const refund=canc.reduce((sum,t)=>sum+t.refund,0);const created=d.tickets.filter(t=>invIDs.has(t.invoice));const rankings=d.movies.map(x=>{const ts=d.tickets.filter(t=>t.status==='SOLD'&&invIDs.has(t.invoice)&&sBy(t.showtime)?.movie===x.id);return {title:x.title,amount:ts.reduce((s,t)=>s+t.paid,0),qty:ts.length}}).sort((a,b)=>b.amount-a.amount);const max=Math.max(1,...rankings.map(x=>x.amount));return `<section class="panel filter-panel"><div class="panel-body"><div class="section-heading"><h2>Kỳ báo cáo</h2><span class="tag orange">REPORT_VIEW · UI DEMO</span></div><div class="filters"><label>Từ ngày<input id="report-from" type="date" value="${from}"></label><label>Đến ngày<input id="report-to" type="date" value="${to}"></label><div class="small-muted" style="grid-column:span 2;align-self:end">Báo cáo dòng tiền theo thời điểm lập hóa đơn và thời điểm hủy vé.</div></div></div></section><div class="summary-grid"><div class="metric"><small>Tiền bán</small><strong>${vnd(soldAmount)}</strong><div class="meta">Theo ngày lập hóa đơn</div></div><div class="metric"><small>Tiền hoàn</small><strong>${vnd(refund)}</strong><div class="meta">Theo ngày hủy vé</div></div><div class="metric"><small>Doanh thu thuần</small><strong>${vnd(soldAmount-refund)}</strong><div class="meta">Tiền bán − tiền hoàn</div></div><div class="metric"><small>Vé tạo / Vé hủy</small><strong>${created.length} / ${canc.length}</strong><div class="meta">Một vé ghế đôi vẫn tính một vé</div></div></div><div class="two-col-even"><section class="panel"><div class="panel-head"><h2>Top phim theo doanh thu vé còn SOLD if($('sale-movie'))$('sale-movie').onchange=ev=>{S.sale.movie=ev.target.value;S.sale.showtime='';S.sale.selected=[];S.sale.types={};S.sale.member='';S.memberQuery='';S.sale.studentConfirm=false;S.sale.ageConfirm=false;S.sale.cashConfirm=false;render()};if($('sale-show'))$('sale-show').onchange=ev=>{S.sale.showtime=ev.target.value;S.sale.selected=[];S.sale.types={};S.sale.studentConfirm=false;S.sale.ageConfirm=false;S.sale.cashConfirm=false;render()};clickAll('[data-ticket-seat]',el=>{const id=el.dataset.ticketSeat,pos=S.sale.selected.indexOf(id);if(pos<0)S.sale.selected.push(id);else S.sale.selected.splice(pos,1);render()});if($('undo-seat'))$('undo-seat').onclick=()=>{S.sale.selected.pop();render()};if($('clear-seats'))$('clear-seats').onclick=()=>{S.sale.selected=[];render()};clickAll('[data-ticket-type]',el=>{});document.querySelectorAll('[data-ticket-type]').forEach(el=>el.onchange=ev=>{S.sale.types[el.dataset.ticketType]=ev.target.value;render()});if($('sale-member-search')){$('sale-member-search').oninput=ev=>{S.memberQuery=ev.target.value;showMemberResults()};showMemberResults()};if($('clear-sale-member'))$('clear-sale-member').onclick=()=>{S.sale.member='';S.memberQuery='';render()};for(const [id,key] of [['student-confirm','studentConfirm'],['age-confirm','ageConfirm'],['cash-confirm','cashConfirm']])if($(id))$(id).onchange=ev=>{S.sale[key]=ev.target.checked};if($('sale-confirm'))$('sale-confirm').onclick=doSale;
for(const [id,key] of [['inv-from','from'],['inv-to','to'],['inv-q','q']])if($(id)){$(id).onchange=ev=>{S.invoiceFilter[key]=ev.target.value;render()};if(key==='q')$(id).oninput=ev=>{S.invoiceFilter.q=ev.target.value;const pos=ev.target.selectionStart;render();$('inv-q')?.focus();$('inv-q')?.setSelectionRange(pos,pos)}};clickAll('[data-invoice]',el=>{S.modal={type:'invoice',id:el.dataset.invoice};render()});
if($('pricing-form')){$('pricing-form').onsubmit=ev=>{ev.preventDefault();if(!has('PRICING_UPDATE'))return toast('Không có quyền thay đổi bảng giá.');const fd=new FormData(ev.currentTarget),v={};for(const key of ['STANDARD','VIP','COUPLE','studentDiscount','memberDiscount']){v[key]=Number(fd.get(key))};if(['STANDARD','VIP','COUPLE'].some(k=>!Number.isFinite(v[k])||v[k]<=0)||['studentDiscount','memberDiscount'].some(k=>!Number.isFinite(v[k])||v[k]<0||v[k]>100))return toast('Giá phải dương, ưu đãi từ 0 đến 100%.');Object.assign(d.pricing,v);render();toast('Đã cập nhật BẢNG GIÁ DEMO (RAM của trang). Chưa lưu backend.');};if($('price-reset'))$('price-reset').onclick=()=>render()};if($('cancel-search'))$('cancel-search').oninput=ev=>{S.cancelQuery=ev.target.value;const pos=ev.target.selectionStart;render();const input=$('cancel-search');if(input){input.focus();input.setSelectionRange(pos,pos)}};if($('clear-cancel-search'))$('clear-cancel-search').onclick=()=>{S.cancelQuery='';render()};clickAll('[data-ticket-cancel]',el=>{S.modal={type:'cancelTicket',id:el.dataset.ticketCancel};render()});for(const [id,key] of [['report-from','from'],['report-to','to']])if($(id))$(id).onchange=ev=>{S.reportFilter[key]=ev.target.value;render()};
clickAll('[data-close]',close);if($('overlay'))$('overlay').onclick=ev=>{if(ev.target.id==='overlay')close()};if($('entity-form'))$('entity-form').onsubmit=submitEntity;if($('seat-delete'))$('seat-delete').onclick=delSeat;if($('confirm-active'))$('confirm-active').onclick=()=>{const {page,id}=S.modal,x=d[page].find(x=>x.id===id);if(x.active&&d.showtimes.some(s=>(page==='movies'?s.movie:s.room)===id&&s.status==='SCHEDULED'&&new Date(s.start)>new Date()))return toast('Chưa thể ngừng hoạt động vì có suất tương lai.');x.active=!x.active;S.modal=null;render();toast('Trạng thái chỉ được thay đổi trong dữ liệu demo.');};if($('ticket-cancel-form'))$('ticket-cancel-form').onsubmit=doTicketCancel;
if($('entity-form')&&S.modal?.page==='showtimes'){$('entity-form').querySelector('[name=start]')?.addEventListener('change',()=>{const start=$('entity-form').querySelector('[name=start]').value;const movie=$('entity-form').querySelector('[name=movie]').value;const dur=mBy(movie)?.duration||0;if(start&&dur){const d=new Date(new Date(start).getTime()+dur*60000);$('entity-form').querySelector('[name=end]').value=d.toLocaleString('sv-SE',{hour12:false}).replace(' ','T').slice(0,16)}});$('entity-form').querySelector('[name=movie]')?.addEventListener('change',()=>{$('entity-form').querySelector('[name=start]')?.dispatchEvent(new Event('change'))});}
}
render();
